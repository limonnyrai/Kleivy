<!DOCTYPE html>
<html lang="ru">

<head>
    <link rel="manifest" href="/Kleivy/manifest.json">
<meta name="theme-color" content="#168cff">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Вход — Клейви Чат</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div class="login-page">

    <div class="login-box">

        <div class="login-logo">
            K
        </div>

        <h1>Клейви Чат</h1>

        <p class="login-subtitle">
            Войди в свой аккаунт
        </p>

        <input
            id="username"
            type="text"
            placeholder="Email"
            autocomplete="email"
        >

        <input
            id="password"
            type="password"
            placeholder="Пароль"
            autocomplete="current-password"
        >

        <button id="loginButton">
            Войти
        </button>

        <p id="loginMessage"></p>

        <p class="register-text">

            Нет аккаунта?

            <button id="registerButton">
                Создать аккаунт
            </button>

        </p>

    </div>

</div>


<script>

/* =================================
   SUPABASE
================================= */

const SUPABASE_URL =
    "https://tnzdjjtubeulxrvfrmfr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_obyiISO1UFNJn6T6JEAiEQ_XLZanE6d";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =================================
   ЭЛЕМЕНТЫ
================================= */

const loginButton =
    document.getElementById("loginButton");

const usernameInput =
    document.getElementById("username");

const passwordInput =
    document.getElementById("password");

const loginMessage =
    document.getElementById("loginMessage");


/* =================================
   ВХОД
================================= */

loginButton.addEventListener(
    "click",
    async function () {

        const email =
            usernameInput.value.trim();

        const password =
            passwordInput.value;


        loginMessage.textContent = "";


        if (email === "" || password === "") {

            loginMessage.textContent =
                "Заполни все поля.";

            return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Вход...";


        const {
            data,
            error
        } =
            await supabaseClient.auth.signInWithPassword({

                email: email,

                password: password

            });


        if (error) {

            console.error(error);

            loginMessage.textContent =
                "Ошибка входа: " +
                error.message;

            loginButton.disabled = false;

            loginButton.textContent =
                "Войти";

            return;

        }


        if (!data.session) {

            loginMessage.textContent =
                "Не удалось создать сессию.";

            loginButton.disabled = false;

            loginButton.textContent =
                "Войти";

            return;

        }


        /* =================================
           УСПЕШНЫЙ ВХОД
        ================================= */

        localStorage.setItem(
            "kleivy_logged_in",
            "true"
        );


        window.location.replace(
            "index.html"
        );

    }
);


/* =================================
   ENTER
================================= */

passwordInput.addEventListener(
    "keydown",
    function (event) {

        if (event.key === "Enter") {

            loginButton.click();

        }

    }
);


/* =================================
   РЕГИСТРАЦИЯ
================================= */

document
    .getElementById("registerButton")
    .addEventListener(
        "click",
        function () {

            window.location.href =
                "register.html";

        }
    );

</script>

</body>

</html>
