<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Клейви Чат</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b12;
            color: white;
            overflow: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .app {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100%;
        }

        /* =========================================
           SIDEBAR
        ========================================= */

        .sidebar {
            width: 330px;
            background: #0d111b;
            border-right: 1px solid #1d2638;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
        }

        .logo {
            padding: 20px;
            font-size: 25px;
            font-weight: bold;
            color: #168cff;
        }

        .search-box {
            padding: 0 15px 15px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid #202c40;
            outline: none;
            background: #151c2a;
            color: white;
            font-size: 15px;
        }

        .search-box input::placeholder {
            color: #7f8ba3;
        }

        .menu {
            display: flex;
            border-top: 1px solid #182235;
            border-bottom: 1px solid #182235;
        }

        .menu button {
            flex: 1;
            border: none;
            background: transparent;
            color: #7f8ba3;
            padding: 15px 5px;
            cursor: pointer;
        }

        .menu button.active {
            color: #168cff;
        }

        .chat-list {
            overflow-y: auto;
            flex: 1;
            -webkit-overflow-scrolling: touch;
        }

        .contact-item {
            padding: 13px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border-bottom: 1px solid #141c2a;
        }

        .contact-item:hover {
            background: #151d2c;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #167cff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .contact-info {
            min-width: 0;
            flex: 1;
        }

        .contact-name {
            font-weight: bold;
            margin-bottom: 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .contact-username {
            color: #75839c;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .empty {
            color: #718099;
            text-align: center;
            padding: 30px 15px;
        }

        /* =========================================
           MAIN
        ========================================= */

        .main {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #080d16;
            height: 100vh;
            height: 100dvh;
        }

        /* =========================================
           DESKTOP CHAT
        ========================================= */

        .chat-header {
            height: 70px;
            min-height: 70px;
            padding: 10px 20px;
            border-bottom: 1px solid #1b2638;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-name {
            font-weight: bold;
        }

        .chat-header-username {
            color: #718099;
            font-size: 13px;
            margin-top: 3px;
        }

        .welcome {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #65738c;
            text-align: center;
            padding: 30px;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .message {
            max-width: 65%;
            padding: 10px 13px;
            border-radius: 14px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            position: relative;
            line-height: 1.35;
        }

        .message.mine {
            align-self: flex-end;
            background: #1267b8;
            border-bottom-right-radius: 4px;
        }

        .message.theirs {
            align-self: flex-start;
            background: #182231;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        .message-input-area {
            display: none;
            padding: 12px;
            border-top: 1px solid #1b2638;
            gap: 10px;
        }

        .message-input-area input {
            flex: 1;
            min-width: 0;
            padding: 13px 15px;
            background: #151d2b;
            border: 1px solid #243149;
            border-radius: 14px;
            color: white;
            outline: none;
            font-size: 15px;
        }

        .send-button {
            width: 48px;
            min-width: 48px;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: #168cff;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        .send-button:active {
            transform: scale(.96);
        }

        /* =========================================
           SEARCH
        ========================================= */

        .search-results {
            display: none;
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .search-card {
            padding: 15px;
            border-bottom: 1px solid #182235;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-card-info {
            flex: 1;
            min-width: 0;
        }

        .add-button {
            border: none;
            background: #168cff;
            color: white;
            padding: 9px 12px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
        }

        .add-button.added {
            background: #263348;
            color: #8c9ab0;
            cursor: default;
        }

        /* =========================================
           PROFILE
        ========================================= */

        .profile-page {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding: 40px;
            -webkit-overflow-scrolling: touch;
        }

        .profile-box {
            max-width: 500px;
            margin: auto;
            background: #101725;
            padding: 30px;
            border-radius: 20px;
        }

        .profile-avatar {
            margin: auto auto 20px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #168cff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            font-weight: bold;
            overflow: hidden;
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .profile-username {
            text-align: center;
            color: #718099;
            margin-top: 7px;
        }

        .profile-button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 12px;
            border: 1px solid #26344c;
            background: #151e2e;
            color: white;
            cursor: pointer;
        }

        .logout {
            background: #2b1720;
            color: #ff7186;
        }

        /* =========================================
           MOBILE TOP BAR
        ========================================= */

        .mobile-topbar {
            display: none;
        }

        .mobile-menu-button {
            border: none;
            background: transparent;
            color: white;
            width: 44px;
            height: 44px;
            font-size: 27px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .mobile-title {
            font-size: 20px;
            font-weight: bold;
            color: #168cff;
            margin-left: 5px;
        }

        .mobile-overlay {
            display: none;
        }

        .mobile-back-button {
            display: none;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            body {
                width: 100%;
                height: 100dvh;
                overflow: hidden;
            }

            .app {
                width: 100%;
                height: 100dvh;
                position: relative;
                overflow: hidden;
            }

            /* БОКОВОЕ МЕНЮ */

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;

                width: 85%;
                max-width: 330px;
                height: 100dvh;

                transform: translateX(-105%);
                transition: transform .25s ease;

                box-shadow: 10px 0 35px rgba(0,0,0,.5);

                z-index: 1000;
            }

            .sidebar.mobile-open {
                transform: translateX(0);
            }

            .logo {
                padding: 20px 18px 15px;
            }

            .search-box {
                padding: 0 12px 12px;
            }

            .menu button {
                padding: 15px 4px;
                font-size: 13px;
            }

            /* ЗАТЕМНЕНИЕ */

            .mobile-overlay {
                display: block;

                position: fixed;
                inset: 0;

                background: rgba(0,0,0,.65);

                opacity: 0;
                pointer-events: none;

                transition: opacity .25s ease;

                z-index: 900;
            }

            .mobile-overlay.active {
                opacity: 1;
                pointer-events: auto;
            }

            /* MAIN */

            .main {
                width: 100%;
                height: 100dvh;
                min-width: 0;
            }

            /* ВЕРХНЯЯ ПАНЕЛЬ */

            .mobile-topbar {
                display: flex;

                width: 100%;
                height: 62px;
                min-height: 62px;

                align-items: center;

                padding: 0 10px;

                background: #0d111b;
                border-bottom: 1px solid #1b2638;
            }

            /* ЧАТ */

            #chatWindow {
                width: 100%;
                height: calc(100dvh - 62px) !important;
                min-height: 0;
            }

            .chat-header {
                height: 62px;
                min-height: 62px;
                padding: 8px 10px;
                gap: 8px;
            }

            .mobile-back-button {
                display: flex;

                width: 40px;
                min-width: 40px;
                height: 42px;

                align-items: center;
                justify-content: center;

                border: none;
                background: transparent;

                color: white;
                font-size: 29px;

                cursor: pointer;
            }

            .chat-header .avatar {
                width: 43px;
                height: 43px;
            }

            .chat-header-name {
                font-size: 15px;
            }

            .chat-header-username {
                font-size: 12px;
            }

            .messages {
                padding: 12px 9px;
                gap: 6px;
            }

            .message {
                max-width: 84%;
                padding: 9px 12px;
                font-size: 15px;
            }

            .message-input-area {
                padding: 8px;
                padding-bottom: max(8px, env(safe-area-inset-bottom));

                min-height: 64px;
            }

            .message-input-area input {
                min-width: 0;
                padding: 12px;
                font-size: 16px;
                border-radius: 14px;
            }

            .send-button {
                width: 46px;
                min-width: 46px;
                height: 46px;
            }

            /* WELCOME */

            .welcome {
                height: calc(100dvh - 62px);
                flex: none;
            }

            .welcome h2 {
                font-size: 22px;
            }

            /* СПИСОК */

            .chat-list {
                height: calc(100dvh - 62px);
            }

            .contact-item {
                min-height: 70px;
                padding: 11px 14px;
            }

            /* ПОИСК */

            .search-results {
                height: calc(100dvh - 62px);
            }

            /* ПРОФИЛЬ */

            .profile-page {
                height: calc(100dvh - 62px);
                padding: 20px 12px;
            }

            .profile-box {
                width: 100%;
                padding: 25px 18px;
            }

            .profile-name {
                font-size: 22px;
            }

            /* ПОИСКОВАЯ КАРТОЧКА */

            .search-card {
                padding: 12px;
            }

            .add-button {
                padding: 9px 10px;
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================================
         SIDEBAR
    ========================================== -->

    <aside class="sidebar">

        <div class="logo">
            Клейви Чат
        </div>

        <div class="search-box">
            <input
                id="searchInput"
                type="text"
                placeholder="Поиск пользователей..."
                autocomplete="off"
            >
        </div>

        <div class="menu">

            <button id="chatsButton" class="active">
                💬 Чаты
            </button>

            <button id="contactsButton">
                👥 Контакты
            </button>

            <button id="profileButton">
                👤 Профиль
            </button>

        </div>

        <div id="chatList" class="chat-list">

            <div class="empty">
                Пока нет чатов
            </div>

        </div>

        <div id="searchResults" class="search-results"></div>

    </aside>


    <!-- =========================================
         MOBILE OVERLAY
    ========================================== -->

    <div
        id="mobileOverlay"
        class="mobile-overlay"
    ></div>


    <!-- =========================================
         MAIN
    ========================================== -->

    <main class="main">

        <!-- MOBILE TOP BAR -->

        <div class="mobile-topbar">

            <button
                id="mobileMenuButton"
                class="mobile-menu-button"
            >
                ☰
            </button>

            <div class="mobile-title">
                Клейви Чат
            </div>

        </div>


        <!-- =========================================
             CHAT
        ========================================== -->

        <div
            id="chatWindow"
            style="display:none; height:100%; flex-direction:column;"
        >

            <div class="chat-header">

                <button
                    id="mobileBackButton"
                    class="mobile-back-button"
                >
                    ←
                </button>

                <div
                    id="chatAvatar"
                    class="avatar"
                ></div>

                <div>

                    <div
                        id="chatName"
                        class="chat-header-name"
                    ></div>

                    <div
                        id="chatUsername"
                        class="chat-header-username"
                    ></div>

                </div>

            </div>


            <div
                id="messages"
                class="messages"
            ></div>


            <div
                id="messageInputArea"
                class="message-input-area"
            >

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Написать сообщение..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    class="send-button"
                >
                    ➤
                </button>

            </div>

        </div>


        <!-- =========================================
             WELCOME
        ========================================== -->

        <div
            id="welcome"
            class="welcome"
        >

            <div>

                <h2>
                    Клейви Чат
                </h2>

                <p>
                    Выберите контакт, чтобы начать общение
                </p>

            </div>

        </div>


        <!-- =========================================
             PROFILE
        ========================================== -->

        <div
            id="profilePage"
            class="profile-page"
        >

            <div class="profile-box">

                <div
                    id="profileAvatar"
                    class="profile-avatar"
                >
                    ?
                </div>

                <div
                    id="profileName"
                    class="profile-name"
                >
                    Загрузка...
                </div>

                <div
                    id="profileUsername"
                    class="profile-username"
                >
                    @username
                </div>

                <button
                    id="editNameButton"
                    class="profile-button"
                >
                    ✏️ Изменить имя
                </button>

                <button
                    id="logoutButton"
                    class="profile-button logout"
                >
                    🚪 Выйти
                </button>

            </div>

        </div>

    </main>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://tnzdjjtubeulxrvfrmfr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_obyiISO1UFNJn6T6JEAiEQ_XLZanE6d";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;

let currentProfile = null;

let currentContact = null;

let realtimeChannel = null;


/* =========================================
   AUTH
========================================= */

async function checkAuth() {

    const {
        data: {
            session
        }
    } = await supabaseClient.auth.getSession();


    if (!session) {

        window.location.href =
            "login.html";

        return;
    }


    currentUser =
        session.user;


    await loadProfile();

    await loadContacts();
}


/* =========================================
   PROFILE
========================================= */

async function loadProfile() {

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", currentUser.id)
        .single();


    if (error) {

        console.error(error);

        return;
    }


    currentProfile =
        data;


    document.getElementById(
        "profileName"
    ).textContent =
        data.name;


    document.getElementById(
        "profileUsername"
    ).textContent =
        "@" + data.username;


    const avatar =
        document.getElementById(
            "profileAvatar"
        );


    if (data.avatar_url) {

        avatar.innerHTML =
            `<img src="${escapeHtml(data.avatar_url)}">`;

    } else {

        avatar.textContent =
            data.name
                .charAt(0)
                .toUpperCase();
    }
}


/* =========================================
   CONTACTS
========================================= */

async function loadContacts() {

    const {
        data: contacts,
        error
    } = await supabaseClient
        .from("contacts")
        .select("contact_id")
        .eq(
            "user_id",
            currentUser.id
        );


    if (error) {

        console.error(error);

        return;
    }


    const list =
        document.getElementById(
            "chatList"
        );


    list.innerHTML = "";


    if (
        !contacts ||
        contacts.length === 0
    ) {

        list.innerHTML =
            `<div class="empty">
                У вас пока нет контактов
            </div>`;

        return;
    }


    for (
        const contact of contacts
    ) {

        const {
            data: profile
        } = await supabaseClient
            .from("profiles")
            .select("*")
            .eq(
                "id",
                contact.contact_id
            )
            .single();


        if (!profile) {
            continue;
        }


        createContactElement(
            profile
        );
    }
}


/* =========================================
   CONTACT ELEMENT
========================================= */

function createContactElement(
    profile
) {

    const list =
        document.getElementById(
            "chatList"
        );


    const item =
        document.createElement(
            "div"
        );


    item.className =
        "contact-item";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar";


    if (profile.avatar_url) {

        avatar.innerHTML =
            `<img src="${escapeHtml(profile.avatar_url)}">`;

    } else {

        avatar.textContent =
            profile.name
                .charAt(0)
                .toUpperCase();
    }


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "contact-info";


    info.innerHTML = `
        <div class="contact-name">
            ${escapeHtml(profile.name)}
        </div>

        <div class="contact-username">
            @${escapeHtml(profile.username)}
        </div>
    `;


    item.appendChild(avatar);

    item.appendChild(info);


    item.onclick = () => {

        openChat(profile);

    };


    list.appendChild(item);
}


/* =========================================
   SEARCH
========================================= */

const searchInput =
    document.getElementById(
        "searchInput"
    );


searchInput.addEventListener(
    "input",
    async function () {

        const query =
            this.value
                .trim()
                .replace(/^@/, "");


        const results =
            document.getElementById(
                "searchResults"
            );


        const chatList =
            document.getElementById(
                "chatList"
            );


        if (!query) {

            results.style.display =
                "none";

            chatList.style.display =
                "block";

            return;
        }


        chatList.style.display =
            "none";

        results.style.display =
            "block";


        results.innerHTML =
            `<div class="empty">
                Поиск...
            </div>`;


        const {
            data,
            error
        } = await supabaseClient
            .from("profiles")
            .select(
                "id,name,username,avatar_url"
            )
            .ilike(
                "username",
                `${query}%`
            )
            .neq(
                "id",
                currentUser.id
            )
            .limit(10);


        if (error) {

            console.error(error);

            results.innerHTML =
                `<div class="empty">
                    Ошибка поиска
                </div>`;

            return;
        }


        results.innerHTML = "";


        if (
            !data ||
            data.length === 0
        ) {

            results.innerHTML =
                `<div class="empty">
                    Пользователь не найден
                </div>`;

            return;
        }


        for (
            const profile of data
        ) {

            await createSearchCard(
                profile
            );
        }

    }
);


/* =========================================
   SEARCH CARD
========================================= */

async function createSearchCard(
    profile
) {

    const results =
        document.getElementById(
            "searchResults"
        );


    const card =
        document.createElement(
            "div"
        );


    card.className =
        "search-card";


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar";


    if (profile.avatar_url) {

        avatar.innerHTML =
            `<img src="${escapeHtml(profile.avatar_url)}">`;

    } else {

        avatar.textContent =
            profile.name
                .charAt(0)
                .toUpperCase();
    }


    const info =
        document.createElement(
            "div"
        );


    info.className =
        "search-card-info";


    info.innerHTML = `
        <div class="contact-name">
            ${escapeHtml(profile.name)}
        </div>

        <div class="contact-username">
            @${escapeHtml(profile.username)}
        </div>
    `;


    const button =
        document.createElement(
            "button"
        );


    button.className =
        "add-button";


    button.textContent =
        "Добавить";


    const {
        data: existing
    } = await supabaseClient
        .from("contacts")
        .select("id")
        .eq(
            "user_id",
            currentUser.id
        )
        .eq(
            "contact_id",
            profile.id
        )
        .maybeSingle();


    if (existing) {

        button.textContent =
            "Добавлен";

        button.classList.add(
            "added"
        );

        button.disabled =
            true;
    }


    button.onclick =
        async () => {

            button.disabled =
                true;


            const {
                error
            } = await supabaseClient
                .from("contacts")
                .insert({
                    user_id:
                        currentUser.id,

                    contact_id:
                        profile.id
                });


            if (error) {

                console.error(error);

                alert(
                    "Не удалось добавить контакт"
                );

                button.disabled =
                    false;

                return;
            }


            button.textContent =
                "Добавлен";


            button.classList.add(
                "added"
            );


            await loadContacts();
        };


    card.appendChild(avatar);

    card.appendChild(info);

    card.appendChild(button);


    results.appendChild(card);
}

/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages() {

    const messages =
        document.getElementById(
            "messages"
        );


    messages.innerHTML =
        "";


    const {
        data,
        error
    } = await supabaseClient
        .from("messages")
        .select("*")
        .or(
            `and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentContact.id}),and(sender_id.eq.${currentContact.id},receiver_id.eq.${currentUser.id})`
        )
        .order(
            "created_at",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        return;
    }


    for (
        const message of data
    ) {

        displayMessage(
            message
        );
    }


    messages.scrollTop =
        messages.scrollHeight;
}


/* =========================================
   DISPLAY MESSAGE
========================================= */

function displayMessage(
    message
) {

    const container =
        document.getElementById(
            "messages"
        );


    const element =
        document.createElement(
            "div"
        );


    element.className =
        "message " +
        (
            message.sender_id ===
            currentUser.id
                ? "mine"
                : "theirs"
        );


    const time =
        new Date(
            message.created_at
        ).toLocaleTimeString(
            "ru-RU",
            {
                hour: "2-digit",
                minute: "2-digit"
            }
        );


    element.innerHTML = `
        <div>
            ${escapeHtml(message.content)}
        </div>

        <div class="message-time">
            ${time}
        </div>
    `;


    container.appendChild(
        element
    );


    container.scrollTop =
        container.scrollHeight;
}


/* =========================================
   SEND MESSAGE
========================================= */

const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


async function sendMessage() {

    const text =
        messageInput.value.trim();


    if (
        !text ||
        !currentContact
    ) {

        return;
    }


    messageInput.value =
        "";


    const {
        error
    } = await supabaseClient
        .from("messages")
        .insert({
            sender_id:
                currentUser.id,

            receiver_id:
                currentContact.id,

            content:
                text
        });


    if (error) {

        console.error(error);

        alert(
            "Сообщение не отправилось"
        );

        messageInput.value =
            text;
    }
}


sendButton.addEventListener(
    "click",
    sendMessage
);


messageInput.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();
        }

    }
);


/* =========================================
   REALTIME
========================================= */

function subscribeToMessages() {

    if (realtimeChannel) {

        supabaseClient.removeChannel(
            realtimeChannel
        );
    }


    realtimeChannel =
        supabaseClient
            .channel(
                "messages-" +
                currentUser.id +
                "-" +
                currentContact.id
            )
            .on(
                "postgres_changes",
                {
                    event: "INSERT",

                    schema: "public",

                    table: "messages"
                },

                payload => {

                    const message =
                        payload.new;


                    if (
                        !currentContact
                    ) {

                        return;
                    }


                    const belongsToChat =
                        (
                            message.sender_id ===
                            currentUser.id &&

                            message.receiver_id ===
                            currentContact.id
                        )
                        ||
                        (
                            message.sender_id ===
                            currentContact.id &&

                            message.receiver_id ===
                            currentUser.id
                        );


                    if (
                        !belongsToChat
                    ) {

                        return;
                    }


                    /*
                       Не добавляем сообщение
                       второй раз, если оно
                       уже отображено.
                    */

                    const existingMessages =
                        document.querySelectorAll(
                            "#messages .message"
                        );


                    for (
                        const existing of
                        existingMessages
                    ) {

                        if (
                            existing.dataset.id ===
                            String(message.id)
                        ) {

                            return;
                        }
                    }


                    displayMessage(
                        message
                    );
                }
            )
            .subscribe();
}

document.getElementById(
    "editNameButton"
).onclick =
    async () => {

        const newName =
            prompt(
                "Введите новое имя:",
                currentProfile.name
            );


        if (!newName) {

            return;
        }


        const cleanName =
            newName.trim();


        if (
            cleanName.length < 2
        ) {

            alert(
                "Имя должно содержать минимум 2 символа"
            );

            return;
        }


        const {
            error
        } = await supabaseClient
            .from("profiles")
            .update({
                name:
                    cleanName
            })
            .eq(
                "id",
                currentUser.id
            );


        if (error) {

            console.error(error);

            alert(
                "Не удалось изменить имя"
            );

            return;
        }


        currentProfile.name =
            cleanName;


        document.getElementById(
            "profileName"
        ).textContent =
            cleanName;
    };

/* =========================================

========================================= */

function escapeHtml(
    text
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text ?? "";


    return div.innerHTML;
}
