<!-- ОСНОВНОЙ SCRIPT -->

<script src="script.js"></script>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://tnzdjjtubeulxrvfrmfr.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_obyiISO1UFNJn6T6JEAiEQ_XLZanE6d";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   ПРОВЕРКА АВТОРИЗАЦИИ
========================================= */

async function checkAuth() {

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();


    if (error) {

        console.error(
            "Ошибка проверки авторизации:",
            error
        );

        window.location.replace(
            "register.html"
        );

        return;

    }


    if (!data.session) {

        window.location.replace(
            "register.html"
        );

        return;

    }


    console.log(
        "Пользователь авторизован:",
        data.session.user.email
    );


    loadProfile();

}


/* =========================================
   ЗАГРУЗКА ПРОФИЛЯ ИЗ SUPABASE
========================================= */

async function loadProfile() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {
        return;
    }


    const {
        data: profile,
        error
    } =
        await supabaseClient
            .from("profiles")
            .select(
                "name, username, avatar_url"
            )
            .eq(
                "id",
                user.id
            )
            .maybeSingle();


    if (error) {

        console.error(
            "Ошибка загрузки профиля:",
            error
        );

        return;

    }


    if (!profile) {
        return;
    }


    /* =========================================
       ИМЯ
    ========================================= */

    if (profile.name) {

        document.getElementById(
            "userName"
        ).textContent =
            profile.name;


        document.getElementById(
            "chatUserName"
        ).textContent =
            profile.name;


        document.getElementById(
            "profileName"
        ).textContent =
            profile.name;


        document.getElementById(
            "profileNameInfo"
        ).textContent =
            profile.name;

    }


    /* =========================================
       USERNAME
    ========================================= */

    if (profile.username) {

        document.getElementById(
            "profileUsername"
        ).textContent =
            "@" + profile.username;


        document.getElementById(
            "profileUsernameInfo"
        ).textContent =
            "@" + profile.username;

    }


    /* =========================================
       АВАТАР
    ========================================= */

    if (profile.avatar_url) {

        setAvatar(
            profile.avatar_url
        );

    }

}


/* =========================================
   АВАТАР
========================================= */

function setAvatar(url) {

    const profileAvatar =
        document.getElementById(
            "profileAvatar"
        );


    const placeholder =
        document.getElementById(
            "avatarPlaceholder"
        );


    const chatAvatar =
        document.getElementById(
            "chatAvatar"
        );


    const headerAvatar =
        document.getElementById(
            "headerAvatar"
        );


    profileAvatar.src =
        url;


    profileAvatar.style.display =
        "block";


    placeholder.style.display =
        "none";


    chatAvatar.style.backgroundImage =
        "url('" + url + "')";


    chatAvatar.style.backgroundSize =
        "cover";


    chatAvatar.style.backgroundPosition =
        "center";


    chatAvatar.textContent =
        "";


    headerAvatar.style.backgroundImage =
        "url('" + url + "')";


    headerAvatar.style.backgroundSize =
        "cover";


    headerAvatar.style.backgroundPosition =
        "center";


    headerAvatar.textContent =
        "";

}


/* =========================================
   НАВИГАЦИЯ
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        const profileButton =
            document.getElementById(
                "profileButton"
            );


        const chatsButton =
            document.getElementById(
                "chatsButton"
            );


        const profilePage =
            document.getElementById(
                "profilePage"
            );


        const chatList =
            document.getElementById(
                "chatList"
            );


        const chatWindow =
            document.getElementById(
                "chatWindow"
            );


        /* ПРОФИЛЬ */

        function openProfile() {

            chatList.style.display =
                "none";


            chatWindow.style.display =
                "none";


            profilePage.style.display =
                "flex";


            document
                .querySelectorAll(
                    ".menu-button"
                )
                .forEach(
                    function (button) {

                        button.classList.remove(
                            "active"
                        );

                    }
                );


            profileButton.classList.add(
                "active"
            );

        }


        /* ЧАТЫ */

        function openChats() {

            profilePage.style.display =
                "none";


            chatList.style.display =
                "block";


            chatWindow.style.display =
                "flex";


            document
                .querySelectorAll(
                    ".menu-button"
                )
                .forEach(
                    function (button) {

                        button.classList.remove(
                            "active"
                        );

                    }
                );


            chatsButton.classList.add(
                "active"
            );

        }


        profileButton.addEventListener(
            "click",
            openProfile
        );


        chatsButton.addEventListener(
            "click",
            openChats
        );

    }
);


/* =========================================
   ИЗМЕНЕНИЕ ИМЕНИ
========================================= */

async function editName() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {
        return;
    }


    const currentName =
        document.getElementById(
            "profileNameInfo"
        ).textContent ||
        "Пользователь";


    const newName =
        prompt(
            "Введите новое имя:",
            currentName
        );


    if (
        newName === null ||
        newName.trim() === ""
    ) {
        return;
    }


    const name =
        newName.trim();


    const {
        error
    } =
        await supabaseClient
            .from("profiles")
            .update({
                name: name
            })
            .eq(
                "id",
                user.id
            );


    if (error) {

        alert(
            "Ошибка сохранения имени: " +
            error.message
        );

        return;

    }


    document.getElementById(
        "userName"
    ).textContent =
        name;


    document.getElementById(
        "chatUserName"
    ).textContent =
        name;


    document.getElementById(
        "profileName"
    ).textContent =
        name;


    document.getElementById(
        "profileNameInfo"
    ).textContent =
        name;

}


document
    .getElementById(
        "editNameButton"
    )
    .addEventListener(
        "click",
        editName
    );


document
    .getElementById(
        "editNameButton2"
    )
    .addEventListener(
        "click",
        editName
    );


/* =========================================
   ВЫХОД
========================================= */

document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        async function () {


            const {
                error
            } =
                await supabaseClient.auth.signOut();


            if (error) {

                alert(
                    "Ошибка выхода: " +
                    error.message
                );

                return;

            }


            window.location.replace(
                "login.html"
            );

        }
    );

/* =========================================
   УДАЛЕНИЕ АККАУНТА
========================================= */

document
    .getElementById("deleteAccountButton")
    .addEventListener(
        "click",
        async function () {

            const confirmed =
                confirm(
                    "ВНИМАНИЕ!\n\n" +
                    "Аккаунт будет полностью удалён.\n" +
                    "Профиль и данные аккаунта будут удалены.\n\n" +
                    "Продолжить?"
                );


            if (!confirmed) {
                return;
            }


            const secondConfirm =
                prompt(
                    "Для подтверждения удаления напиши: УДАЛИТЬ"
                );


            if (
                secondConfirm !== "УДАЛИТЬ"
            ) {

                alert(
                    "Удаление отменено."
                );

                return;

            }


            const {
                error
            } =
                await supabaseClient
                    .rpc(
                        "delete_my_account"
                    );


            if (error) {

                console.error(
                    "Ошибка удаления:",
                    error
                );

                alert(
                    "Не удалось удалить аккаунт:\n" +
                    error.message
                );

                return;

            }


            await supabaseClient.auth.signOut();


            localStorage.removeItem(
                "kleivy_logged_in"
            );


            localStorage.removeItem(
                "username"
            );


            window.location.replace(
                "register.html"
            );

        }
    );
/* =========================================
   ЗАПУСК
========================================= */

checkAuth();

</script>

</body>

</html>
