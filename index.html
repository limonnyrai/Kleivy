<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Клейви Чат</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#080b12;
    color:white;
    overflow:hidden;
}

button,input,textarea{font-family:inherit}
button{-webkit-tap-highlight-color:transparent}

.app{
    display:flex;
    width:100%;
    height:100vh;
    height:100dvh;
}

/* SIDEBAR */

.sidebar{
    width:330px;
    background:#0d111b;
    border-right:1px solid #1d2638;
    display:flex;
    flex-direction:column;
    flex-shrink:0;
    z-index:100;
}

.logo{
    padding:20px;
    font-size:25px;
    font-weight:bold;
    color:#168cff;
}

.sidebar-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-right:15px;
}

.plus-button{
    width:42px;
    height:42px;
    border:none;
    border-radius:12px;
    background:#168cff;
    color:white;
    font-size:25px;
    cursor:pointer;
}

.plus-button:active{transform:scale(.95)}

.search-box{
    padding:0 15px 15px;
}

.search-box input{
    width:100%;
    padding:12px 15px;
    border-radius:12px;
    border:1px solid #202c40;
    outline:none;
    background:#151c2a;
    color:white;
    font-size:15px;
}

.search-box input::placeholder{color:#7f8ba3}

.menu{
    display:flex;
    border-top:1px solid #182235;
    border-bottom:1px solid #182235;
}

.menu button{
    flex:1;
    border:none;
    background:transparent;
    color:#7f8ba3;
    padding:15px 5px;
    cursor:pointer;
}

.menu button.active{color:#168cff}

.chat-list{
    overflow-y:auto;
    flex:1;
    min-height:0;
    -webkit-overflow-scrolling:touch;
}

.contact-item,
.channel-item{
    padding:13px 16px;
    display:flex;
    align-items:center;
    gap:12px;
    cursor:pointer;
    border-bottom:1px solid #141c2a;
}

.contact-item:hover,
.channel-item:hover{
    background:#151d2c;
}

.avatar{
    width:48px;
    height:48px;
    min-width:48px;
    border-radius:50%;
    background:#167cff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
    overflow:hidden;
    flex-shrink:0;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.contact-info{
    min-width:0;
    flex:1;
}

.contact-name{
    font-weight:bold;
    margin-bottom:5px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.contact-username{
    color:#75839c;
    font-size:13px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

/* VERIFIED USERS */

.username-special{
    font-weight:bold;
    background:linear-gradient(
        90deg,
        #8a5d10,
        #c89525,
        #fff0a0,
        #d8ad3b,
        #fff6bf,
        #a87516,
        #8a5d10
    );
    background-size:400% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    color:transparent;
    animation:goldShine 3s linear infinite;
}

.verified-badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:17px;
    height:17px;
    margin-left:5px;
    border-radius:50%;
    background:#ffffff;
    color:#080b12;
    font-size:11px;
    font-weight:900;
    line-height:1;
    vertical-align:middle;
    box-shadow:
        0 0 0 1px #777,
        0 0 5px rgba(255,255,255,.2);
}

@keyframes goldShine{
    0%{
        background-position:400% 0;
    }

    100%{
        background-position:-400% 0;
    }
}

.profile-username.username-special{
    font-size:15px;
}

.chat-header-username.username-special{
    color:transparent;
}

.channel-badge{
    color:#168cff;
    font-size:11px;
    margin-left:5px;
}

.empty{
    color:#718099;
    text-align:center;
    padding:30px 15px;
}

/* MAIN */

.main{
    flex:1;
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    background:#080d16;
    height:100vh;
    height:100dvh;
}

.chat-header{
    height:70px;
    min-height:70px;
    padding:10px 20px;
    border-bottom:1px solid #1b2638;
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-header-name{font-weight:bold}

.chat-header-username{
    color:#718099;
    font-size:13px;
    margin-top:3px;
}

.welcome{
    flex:1;
    min-height:0;
    display:flex;
    justify-content:center;
    align-items:center;
    color:#65738c;
    text-align:center;
    padding:30px;
}

.messages{
    flex:1;
    min-height:0;
    padding:20px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:8px;
    -webkit-overflow-scrolling:touch;
}

.message{
    max-width:65%;
    padding:10px 13px;
    border-radius:14px;
    word-wrap:break-word;
    overflow-wrap:anywhere;
    position:relative;
    line-height:1.35;
}

.message.mine{
    align-self:flex-end;
    background:#1267b8;
    border-bottom-right-radius:4px;
}

.message.theirs{
    align-self:flex-start;
    background:#182231;
    border-bottom-left-radius:4px;
}

.message-time{
    font-size:10px;
    opacity:.6;
    margin-top:4px;
    text-align:right;
}

/* MEDIA */

.message-media{
    margin:-2px -2px 8px;
}

.message-image{
    display:block;
    width:100%;
    max-width:360px;
    max-height:420px;
    object-fit:cover;
    border-radius:11px;
    cursor:pointer;
}

.message-caption{
    white-space:pre-wrap;
    word-break:break-word;
}

.file-card{
    min-width:220px;
    max-width:340px;
    padding:12px;
    border-radius:12px;
    background:rgba(0,0,0,.18);
    display:flex;
    align-items:center;
    gap:10px;
}

.file-icon{
    font-size:30px;
    flex-shrink:0;
}

.file-info{
    min-width:0;
    flex:1;
}

.file-name{
    font-weight:bold;
    word-break:break-word;
}

.file-size{
    color:#aab5c7;
    font-size:12px;
    margin-top:4px;
}

.file-download{
    border:none;
    width:38px;
    height:38px;
    border-radius:10px;
    background:#168cff;
    color:white;
    cursor:pointer;
    font-size:18px;
    flex-shrink:0;
}

.message-input-area{
    display:none;
    padding:12px;
    border-top:1px solid #1b2638;
    gap:8px;
    flex-shrink:0;
    align-items:center;
}

.attach-button{
    width:48px;
    min-width:48px;
    height:48px;
    border:none;
    border-radius:14px;
    background:#151d2b;
    border:1px solid #243149;
    color:#b8c4d7;
    font-size:22px;
    cursor:pointer;
}

.attach-button:active{
    transform:scale(.95);
}

.message-input-area input{
    flex:1;
    min-width:0;
    padding:13px 15px;
    background:#151d2b;
    border:1px solid #243149;
    border-radius:14px;
    color:white;
    outline:none;
    font-size:15px;
}

.send-button{
    width:48px;
    min-width:48px;
    height:48px;
    border:none;
    border-radius:14px;
    background:#168cff;
    color:white;
    font-size:20px;
    cursor:pointer;
}

/* FILE PREVIEW */

.file-preview{
    display:none;
    padding:8px 12px;
    border-top:1px solid #1b2638;
    background:#0e1521;
    align-items:center;
    gap:10px;
}

.file-preview.active{
    display:flex;
}

.file-preview-image{
    width:48px;
    height:48px;
    object-fit:cover;
    border-radius:9px;
}

.file-preview-icon{
    width:48px;
    height:48px;
    border-radius:9px;
    background:#182438;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    flex-shrink:0;
}

.file-preview-info{
    flex:1;
    min-width:0;
}

.file-preview-name{
    font-weight:bold;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.file-preview-size{
    color:#718099;
    font-size:12px;
    margin-top:3px;
}

.file-preview-remove{
    border:none;
    background:transparent;
    color:#ff7186;
    font-size:22px;
    cursor:pointer;
}

/* SEARCH */

.search-results{
    display:none;
    flex:1;
    min-height:0;
    overflow-y:auto;
}

.search-card{
    padding:15px;
    border-bottom:1px solid #182235;
    display:flex;
    align-items:center;
    gap:12px;
}

.search-card-info{
    flex:1;
    min-width:0;
}

.add-button{
    border:none;
    background:#168cff;
    color:white;
    padding:9px 12px;
    border-radius:10px;
    cursor:pointer;
    white-space:nowrap;
}

.add-button.added{
    background:#263348;
    color:#8c9ab0;
    cursor:default;
}

/* PROFILE */

.profile-page{
    display:none;
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:40px;
    -webkit-overflow-scrolling:touch;
}

.profile-box{
    width:100%;
    max-width:500px;
    margin:0 auto;
    background:#101725;
    padding:30px;
    border-radius:20px;
}

.profile-avatar{
    margin:auto auto 20px;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#168cff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    font-weight:bold;
    overflow:hidden;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    text-align:center;
    font-size:24px;
    font-weight:bold;
}

.profile-username{
    text-align:center;
    color:#718099;
    margin-top:7px;
}

.profile-button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border-radius:12px;
    border:1px solid #26344c;
    background:#151e2e;
    color:white;
    cursor:pointer;
}

.avatar-upload-info{
    text-align:center;
    color:#718099;
    font-size:12px;
    margin-top:8px;
}

#changeAvatarButton{
    margin-top:0;
}
.logout{
    background:#2b1720;
    color:#ff7186;
}

/* MODALS */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:3000;
    padding:15px;
}

.modal.active{display:flex}

.modal-box{
    width:100%;
    max-width:480px;
    max-height:90vh;
    overflow-y:auto;
    background:#101725;
    border:1px solid #26344c;
    border-radius:20px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.modal-title{
    font-size:23px;
    font-weight:bold;
    margin-bottom:20px;
}

.modal-label{
    display:block;
    color:#9ba8bd;
    font-size:13px;
    margin-bottom:7px;
    margin-top:15px;
}

.modal-input,
.modal-textarea{
    width:100%;
    padding:13px;
    border-radius:12px;
    border:1px solid #26344c;
    background:#151e2e;
    color:white;
    outline:none;
    font-size:15px;
}

.modal-textarea{
    resize:vertical;
    min-height:90px;
}

.channel-photo-area{
    display:flex;
    justify-content:center;
    margin-bottom:10px;
}

.channel-photo-preview{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#168cff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:35px;
    font-weight:bold;
    overflow:hidden;
    cursor:pointer;
}

.channel-photo-preview img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.channel-type{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.type-option{
    flex:1;
    padding:13px;
    border:1px solid #26344c;
    border-radius:12px;
    background:#151e2e;
    color:#9ba8bd;
    cursor:pointer;
    text-align:center;
}

.type-option.selected{
    border-color:#168cff;
    background:#102d4b;
    color:white;
}

.modal-buttons{
    display:flex;
    gap:10px;
    margin-top:22px;
}

.modal-cancel,
.modal-create{
    flex:1;
    padding:13px;
    border-radius:12px;
    cursor:pointer;
    border:none;
}

.modal-cancel{
    background:#202b3e;
    color:white;
}

.modal-create{
    background:#168cff;
    color:white;
}

.channel-info{text-align:center}

.channel-info-avatar{
    width:110px;
    height:110px;
    border-radius:50%;
    margin:0 auto 15px;
    background:#168cff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:40px;
    font-weight:bold;
    overflow:hidden;
}

.channel-info-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.channel-info-name{
    font-size:25px;
    font-weight:bold;
}

.channel-info-description{
    margin-top:10px;
    color:#9ba8bd;
    line-height:1.5;
    white-space:pre-wrap;
}

.channel-info-link{
    margin-top:18px;
    padding:13px;
    background:#151e2e;
    border-radius:12px;
    color:#168cff;
    word-break:break-all;
}

.channel-info-type{
    margin-top:10px;
    color:#718099;
    font-size:13px;
}

/* MEDIA VIEWER */

.media-viewer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.92);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:5000;
    padding:20px;
}

.media-viewer.active{
    display:flex;
}

.media-viewer-content{
    max-width:100%;
    max-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:15px;
}

.media-viewer img{
    max-width:95vw;
    max-height:78vh;
    object-fit:contain;
    border-radius:10px;
}

.media-viewer-buttons{
    display:flex;
    gap:10px;
}

.media-viewer-buttons button{
    border:none;
    border-radius:12px;
    padding:12px 18px;
    background:#168cff;
    color:white;
    cursor:pointer;
    font-size:14px;
}

.media-viewer-buttons .close-media{
    background:#263348;
}

.upload-progress{
    display:none;
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:3px;
    background:#168cff;
}

/* MOBILE */

.mobile-topbar{display:none}

.mobile-menu-button{
    border:none;
    background:transparent;
    color:white;
    width:44px;
    height:44px;
    font-size:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
}

.mobile-title{
    font-size:20px;
    font-weight:bold;
    color:#168cff;
    margin-left:5px;
}

.mobile-overlay{display:none}

.mobile-back-button{display:none}

@media(max-width:700px){

    html,body{
        width:100%;
        height:100%;
        overflow:hidden;
    }

    body{height:100dvh}

    .app{
        height:100dvh;
        position:relative;
        overflow:hidden;
    }

    .sidebar{
        position:fixed;
        left:0;
        top:0;
        width:85%;
        max-width:330px;
        height:100dvh;
        transform:translateX(-105%);
        transition:transform .25s ease;
        box-shadow:10px 0 35px rgba(0,0,0,.5);
        z-index:1000;
    }

    .sidebar.mobile-open{
        transform:translateX(0);
    }

    .logo{padding:20px 18px 15px}

    .search-box{padding:0 12px 12px}

    .menu button{
        padding:15px 4px;
        font-size:13px;
    }

    .mobile-overlay{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.65);
        opacity:0;
        pointer-events:none;
        transition:opacity .25s ease;
        z-index:900;
    }

    .mobile-overlay.active{
        opacity:1;
        pointer-events:auto;
    }

    .main{
        width:100%;
        height:100dvh;
        min-height:0;
    }

    .mobile-topbar{
        display:flex;
        width:100%;
        height:62px;
        min-height:62px;
        align-items:center;
        padding:0 10px;
        background:#0d111b;
        border-bottom:1px solid #1b2638;
        flex-shrink:0;
    }

    #chatWindow{
        width:100%;
        height:calc(100dvh - 62px);
        min-height:0;
        flex:1;
    }

    .chat-header{
        height:62px;
        min-height:62px;
        padding:8px 10px;
        gap:8px;
    }

    .mobile-back-button{
        display:flex;
        width:40px;
        min-width:40px;
        height:42px;
        align-items:center;
        justify-content:center;
        border:none;
        background:transparent;
        color:white;
        font-size:29px;
        cursor:pointer;
    }

    .chat-header .avatar{
        width:43px;
        height:43px;
        min-width:43px;
    }

    .messages{
        padding:12px 9px;
        min-height:0;
    }

    .message{
        max-width:88%;
        font-size:15px;
    }

    .message-image{
        max-width:260px;
        max-height:360px;
    }

    .file-card{
        min-width:190px;
        max-width:270px;
    }

    .message-input-area{
        padding:8px;
        padding-bottom:max(8px,env(safe-area-inset-bottom));
        min-height:64px;
    }

    .message-input-area input{
        font-size:16px;
    }

    .attach-button,
    .send-button{
        width:44px;
        min-width:44px;
        height:44px;
    }

    .welcome{
        height:calc(100dvh - 62px);
        flex:1;
        min-height:0;
    }

    .chat-list{
        height:auto;
        flex:1;
        min-height:0;
    }

    .search-results{
        height:auto;
        flex:1;
        min-height:0;
    }

    .profile-page{
        flex:1;
        min-height:0;
        height:auto;
        overflow-y:auto;
        padding:20px 12px;
        -webkit-overflow-scrolling:touch;
    }

    .profile-box{
        width:100%;
        max-width:500px;
        margin:0 auto;
        padding:25px 18px;
    }

    .modal{
        align-items:flex-end;
        padding:0;
    }

    .modal-box{
        max-width:none;
        max-height:94dvh;
        border-radius:22px 22px 0 0;
        padding:22px 18px;
    }

    .media-viewer{
        padding:10px;
    }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

<div class="sidebar-top">
<div class="logo">Клейви Чат</div>

<button id="plusButton" class="plus-button">+</button>
</div>

<div class="search-box">
<input
id="searchInput"
type="text"
placeholder="Поиск пользователей и каналов..."
autocomplete="off">
</div>

<div class="menu">

<button id="chatsButton" class="active">💬 Чаты</button>

<button id="contactsButton">👥 Контакты</button>

<button id="profileButton">👤 Профиль</button>

</div>

<div id="chatList" class="chat-list">
<div class="empty">Пока нет чатов</div>
</div>

<div id="searchResults" class="search-results"></div>

</aside>

<div id="mobileOverlay" class="mobile-overlay"></div>

<main class="main">

<div class="mobile-topbar">

<button id="mobileMenuButton" class="mobile-menu-button">
☰
</button>

<div class="mobile-title">
Клейви Чат
</div>

</div>

<div
id="chatWindow"
style="display:none;height:100%;flex-direction:column;min-height:0;"
>

<div class="chat-header">

<button id="mobileBackButton" class="mobile-back-button">
←
</button>

<div id="chatAvatar" class="avatar"></div>

<div>
<div id="chatName" class="chat-header-name"></div>

<div id="chatUsername" class="chat-header-username"></div>
</div>

</div>

<div id="messages" class="messages"></div>

<div id="filePreview" class="file-preview">

<div id="filePreviewVisual"></div>

<div class="file-preview-info">

<div id="filePreviewName" class="file-preview-name"></div>

<div id="filePreviewSize" class="file-preview-size"></div>

</div>

<button
id="removeFileButton"
class="file-preview-remove"
>
×
</button>

</div>

<script>

const SUPABASE_URL =
"https://tnzdjjtubeulxrvfrmfr.supabase.co";

const SUPABASE_KEY =
"sb_publishable_obyiISO1UFNJn6T6JEAiEQ_XLZanE6d";

const supabaseClient =
window.supabase.createClient(

/* AUTH */

async function checkAuth(){

const {
data:{session}
}=await supabaseClient.auth.getSession();

if(!session){

window.location.href="login.html";
return;
}

currentUser=session.user;

await loadProfile();
await loadChats();
}


/* VERIFIED USERS */

function isSpecialUser(profile){

if(!profile || !profile.username){
return false;
}

const username =
profile.username
.replace(/^@/,"")
.trim()
.toLowerCase();

return username === "abdulla" || username === "хакер";
}


function usernameHTML(profile){

const username =
escapeHtml(profile.username || "");

if(isSpecialUser(profile)){

return `
<span class="username-special">
@${username}
</span>
<span
class="verified-badge"
title="Подтверждённый пользователь"
>
✓
</span>
`;

}

return `@${username}`;
}


/* PROFILE */

async function loadProfile(){

const {
data,
error
}=await supabaseClient
.from("profiles")
.select("*")
.eq("id",currentUser.id)
.single();

if(error){

console.error(error);
return;
}

currentProfile=data;

document.getElementById("profileName").textContent=
data.name;

const profileUsernameElement =
document.getElementById("profileUsername");

profileUsernameElement.innerHTML =
usernameHTML(data);

profileUsernameElement.classList.toggle(
"username-special",
isSpecialUser(data)
);

const avatar =
document.getElementById("profileAvatar");

if(data.avatar_url){

avatar.innerHTML =
`<img src="${escapeHtml(data.avatar_url)}" alt="">`;

}else{

avatar.textContent =
data.name.charAt(0).toUpperCase();

}
}


/* LOAD CHATS */

async function loadChats(){

const list =
document.getElementById("chatList");

list.innerHTML="";

let hasSomething=false;

const {
data:contacts,
error:contactsError
}=await supabaseClient
.from("contacts")
.select("contact_id")
.eq("user_id",currentUser.id);

if(!contactsError && contacts){

for(const contact of contacts){

const {data:profile} =
await supabaseClient
.from("profiles")
.select("*")
.eq("id",contact.contact_id)
.single();

if(!profile)continue;

createContactElement(profile);

hasSomething=true;
}
}

const {
data:channels,
error:channelsError
}=await supabaseClient
.from("channels")
.select("*")
.order("created_at",{ascending:false});

if(channelsError){

console.warn(
"Каналы недоступны:",
channelsError.message
);

}else if(channels){

for(const channel of channels){

const canShow =
channel.type==="public" ||
channel.owner_id===currentUser.id;

if(!canShow)continue;

createChannelElement(channel);

hasSomething=true;
}
}

if(!hasSomething){

list.innerHTML =
`<div class="empty">Пока нет чатов</div>`;
}
}

const list =
document.getElementById("chatList");

const item =
document.createElement("div");

item.className="contact-item";

const avatar =
document.createElement("div");

avatar.className="avatar";

setAvatar(avatar,profile);

const info =
document.createElement("div");

info.className="contact-info";

info.innerHTML = `
<div class="contact-name">
${escapeHtml(profile.name)}
</div>

<div class="contact-username">
${usernameHTML(profile)}
</div>
`;

item.appendChild(avatar);
item.appendChild(info);

item.onclick=()=>{
openChat(profile);
};

document.getElementById("chatList");

const item =
document.createElement("div");

item.className="channel-item";

const avatar =
document.createElement("div");

avatar.className="avatar";

setChannelAvatar(avatar,channel);

document.createElement("div");

info.className="contact-info";

const usernameText =
channel.username
?"@"+channel.username
:"🔒 Частный канал";

info.innerHTML=`
<div class="contact-name">
${escapeHtml(channel.name)}
<span class="channel-badge">📢</span>
</div>

<div class="contact-username">
${escapeHtml(usernameText)}
</div>
`;

item.appendChild(avatar);
item.appendChild(info);

item.onclick=()=>{
openChannel(channel);
};

item.oncontextmenu=event=>{

event.preventDefault();

openChannelInfo(channel);

};

list.appendChild(item);
}


/* SEARCH */

const searchInput =
document.getElementById("searchInput");

searchInput.addEventListener(
"input",
async function(){

const query =
this.value
.trim()
.replace(/^@/,"")
.toLowerCase();

const results =
document.getElementById("searchResults");

const chatList =
document.getElementById("chatList");

if(!query){

results.style.display="none";
chatList.style.display="block";

return;
}

chatList.style.display="none";
results.style.display="block";

results.innerHTML =
`<div class="empty">Поиск...</div>`;

let found=false;

const {
data:users,
error:usersError
}=await supabaseClient
.from("profiles")
.select("id,name,username,avatar_url")
.ilike("username",`${query}%`)
.neq("id",currentUser.id)
.limit(10);

if(!usersError && users){

for(const profile of users){

found=true;

const card =
document.createElement("div");

card.className="search-card";

const avatar =
document.createElement("div");

avatar.className="avatar";

setAvatar(avatar,profile);

const info =
document.createElement("div");

info.className="search-card-info";

info.innerHTML=`
<div class="contact-name">
${escapeHtml(profile.name)}
</div>

<div class="contact-username">
${usernameHTML(profile)}
</div>
`;

const button =
document.createElement("button");

button.className="add-button";

button.textContent="Добавить";

const {data:existing} =
await supabaseClient
.from("contacts")
.select("id")
.eq("user_id",currentUser.id)
.eq("contact_id",profile.id)
.maybeSingle();

if(existing){

button.textContent="Добавлен";

button.classList.add("added");

button.disabled=true;
}

button.onclick=async event=>{

event.stopPropagation();

const {error} =
await supabaseClient
.from("contacts")
.insert({
user_id:currentUser.id,
contact_id:profile.id
});

if(error){

console.error(error);

alert(
"Не удалось добавить контакт"
);

return;
}

button.textContent="Добавлен";

button.classList.add("added");

button.disabled=true;

await loadChats();
};

card.appendChild(avatar);
card.appendChild(info);
card.appendChild(button);

results.appendChild(card);
}
}

const {
data:channels,
error:channelsError
}=await supabaseClient
.from("channels")
.select("*")
.eq("type","public")
.or(
`username.ilike.${query}%,name.ilike.%${query}%`
)
.limit(10);

if(!channelsError && channels){

for(const channel of channels){

found=true;

const card =
document.createElement("div");

card.className="search-card";

const avatar =
document.createElement("div");

avatar.className="avatar";

setChannelAvatar(avatar,channel);

const info =
document.createElement("div");

info.className="search-card-info";

info.innerHTML=`
<div class="contact-name">
${escapeHtml(channel.name)}
<span class="channel-badge">📢</span>
</div>

<div class="contact-username">
@${escapeHtml(channel.username||"")}
</div>
`;

const button =
document.createElement("button");

button.className="add-button";

button.textContent="Открыть";

button.onclick=()=>{
openChannel(channel);
};

card.appendChild(avatar);
card.appendChild(info);
card.appendChild(button);

results.appendChild(card);
}
}

if(!found){

results.innerHTML =
`<div class="empty">Ничего не найдено</div>`;
}

});

currentChannel=null;

stopRealtime();

clearSelectedFile();

hideContentForChat();

document.getElementById("chatWindow").style.display="flex";

document.getElementById("messageInputArea").style.display="flex";

if(window.innerWidth<=700){

"mobileBackButton"

setAvatar(
document.getElementById("chatAvatar"),
profile

document.getElementById("chatUsername");

chatUsernameElement.innerHTML =
usernameHTML(profile);

chatUsernameElement.classList.toggle(

);

document.getElementById(
"messageInput"

"Написать сообщение...";

await loadMessages();

subscribeToMessages();

/* OPEN CHANNEL */

async function openChannel(channel){

currentChannel=channel;
currentContact=null;

stopRealtime();

clearSelectedFile();

hideContentForChat();

document.getElementById("chatWindow").style.display="flex";

if(window.innerWidth<=700){

closeMobileMenu();

document.getElementById(
"mobileBackButton"
).style.display="flex";
}

setChannelAvatar(
document.getElementById("chatAvatar"),
channel
);

document.getElementById("chatName").textContent =
channel.name;

document.getElementById("chatUsername").textContent =
channel.username
?"@"+channel.username
:"🔒 Частный канал";

document.getElementById(
"chatUsername"
).classList.remove("username-special");

const canWrite =
await canWriteToChannel(channel);

if(canWrite){

document.getElementById(
"messageInputArea"
).style.display="flex";

document.getElementById(
"messageInput"

}else{

document.getElementById(
"messageInputArea"

}

await loadChannelMessages();

/* CHECK CHANNEL WRITE */

async function canWriteToChannel(channel){

if(channel.owner_id===currentUser.id){
return true;
}

const {
data,
error
}=await supabaseClient
.from("channel_members")
.select("role")
.eq("channel_id",channel.id)
.eq("user_id",currentUser.id)
.maybeSingle();

if(error||!data){
return false;
}

return data.role==="admin" ||
data.role==="owner";
}


/* LOAD PERSONAL MESSAGES */

async function loadMessages(){

const messages =
document.getElementById("messages");

messages.innerHTML="";

const {
data,
error
}=await supabaseClient
.from("messages")
.select("*")
.or(
`and(sender_id.eq.${currentUser.id},receiver_id.eq.${currentContact.id}),and(sender_id.eq.${currentContact.id},receiver_id.eq.${currentUser.id})`
)
.order("created_at",{ascending:true});

if(error){

console.error(error);
return;
}

for(const message of data){

displayMessage(message);
}

messages.scrollTop =
messages.scrollHeight;
}


/* LOAD CHANNEL MESSAGES */

async function loadChannelMessages(){

const messages =
document.getElementById("messages");

messages.innerHTML="";

const {
data,
error
}=await supabaseClient
.from("channel_messages")
.select("*")
.eq("channel_id",currentChannel.id)
.order("created_at",{ascending:true});

if(error){

console.error(error);
return;
}

for(const message of data){

displayChannelMessage(message);
}

messages.scrollTop =
messages.scrollHeight;
}


/* DISPLAY PERSONAL MESSAGE */

function displayMessage(message){

const container =
document.getElementById("messages");

if(
container.querySelector(
`[data-id="${message.id}"]`
)
){
return;
}

const element =
document.createElement("div");

element.className =
"message "+
(
message.sender_id===currentUser.id
?"mine"
:"theirs"
);

element.dataset.id =
String(message.id);

const time =
new Date(message.created_at)
.toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"
}
);


/* MEDIA */

if(message.media_url){

const mediaWrap =
document.createElement("div");

mediaWrap.className="message-media";

if(
message.media_type &&
message.media_type.startsWith("image/")
){

const image =
document.createElement("img");

image.className="message-image";

image.src =
message.media_url;

image.alt =
message.media_name ||
"Изображение";

image.loading="lazy";

image.onclick=()=>{
openMediaViewer(
message.media_url
);
};

mediaWrap.appendChild(image);

}else{

const fileCard =
document.createElement("div");

fileCard.className="file-card";

const icon =
document.createElement("div");

icon.className="file-icon";

icon.textContent="📄";

const info =
document.createElement("div");

info.className="file-info";

const name =
document.createElement("div");

name.className="file-name";

name.textContent =
message.media_name ||
"Файл";

const size =
document.createElement("div");

size.className="file-size";

size.textContent =
formatFileSize(
message.media_size
);

info.appendChild(name);
info.appendChild(size);

const download =
document.createElement("button");

download.className="file-download";

download.textContent="⬇️";

download.onclick=()=>{
downloadFile(
message.media_url,
message.media_name ||
"file"
);
};

fileCard.appendChild(icon);
fileCard.appendChild(info);
fileCard.appendChild(download);

mediaWrap.appendChild(fileCard);
}

element.appendChild(mediaWrap);
}


/* CAPTION / TEXT */

if(message.content){

const caption =
document.createElement("div");

caption.className =
"message-caption";

caption.textContent =
message.content;

element.appendChild(caption);
}

const timeElement =
document.createElement("div");

timeElement.className =
"message-time";

timeElement.textContent =
time;

element.appendChild(timeElement);

container.appendChild(element);

container.scrollTop =
container.scrollHeight;
}

function displayChannelMessage(message){

const container =
document.getElementById("messages");

if(
container.querySelector(
`[data-id="${message.id}"]`
)
){
return;
}

const element =
document.createElement("div");

element.className="message mine";

element.dataset.id =
String(message.id);

const time =
new Date(message.created_at)
.toLocaleTimeString(
"ru-RU",
{
hour:"2-digit",
minute:"2-digit"

element.innerHTML=`
<div>
${escapeHtml(message.content)}

${time}

`;

/* FILE SELECT */

const fileInput =
document.getElementById("fileInput");

document.getElementById(
"attachButton"
).onclick=()=>{

if(!currentContact){

alert(
"Файлы пока можно отправлять только в личных чатах."
);

return;
}

fileInput.click();
};


fileInput.addEventListener(
"change",
event=>{

const file =
event.target.files[0];

if(!file){
return;
}

const maxSize =
50*1024*1024;

if(file.size>maxSize){

alert(
"Файл слишком большой. Максимальный размер — 50 МБ."
);

fileInput.value="";

return;
}

selectedChatFile=file;

showFilePreview(file);
});

function showFilePreview(file){

const preview =
document.getElementById(
"filePreview"
);

const visual =
document.getElementById(
"filePreviewVisual"
);

document.getElementById(
"filePreviewName"
).textContent =
file.name;

document.getElementById(
"filePreviewSize"
).textContent =
formatFileSize(file.size);

visual.innerHTML="";

if(file.type.startsWith("image/")){

const image =
document.createElement("img");

image.className =
"file-preview-image";

image.src =
URL.createObjectURL(file);

visual.appendChild(image);

}else{

const icon =
document.createElement("div");

icon.className =
"file-preview-icon";

icon.textContent="📄";

visual.appendChild(icon);
}

preview.classList.add("active");

document.getElementById(
"removeFileButton"
).onclick=()=>{
clearSelectedFile();

function clearSelectedFile(){

selectedChatFile=null;

fileInput.value="";

document.getElementById(
"filePreview"
).classList.remove("active");

document.getElementById(
"filePreviewVisual"
).innerHTML="";

document.getElementById(
"filePreviewName"

document.getElementById(
"filePreviewSize"

/* SEND MESSAGE */

const messageInput =
document.getElementById(
"messageInput"
);

const sendButton =
document.getElementById(
"sendButton"
);

async function sendMessage(){

const text =
messageInput.value.trim();

if(!text && !selectedChatFile){
return;
}


/* PERSONAL CHAT */

if(currentContact){

const file =
selectedChatFile;

messageInput.value="";

sendButton.disabled=true;

try{

let mediaUrl=null;
let mediaName=null;
let mediaType=null;
let mediaSize=null;


/* UPLOAD FILE */

if(file){

const extension =
file.name.includes(".")
?file.name.split(".").pop().toLowerCase()
:"";

const filePath =
currentUser.id+
"/"+
crypto.randomUUID()+
(extension
?"."+extension
:"");

const {
error:uploadError
}=await supabaseClient
.storage
.from("chat-media")
.upload(
filePath,
file,
{
cacheControl:"3600",
upsert:false,
contentType:
file.type ||
"application/octet-stream"
}
);

if(uploadError){

console.error(
uploadError
);

throw new Error(
"Не удалось загрузить файл: "+
uploadError.message
);
}

const {
data:publicData
}=supabaseClient
.storage
.from("chat-media")
.getPublicUrl(
filePath
);

mediaUrl =
publicData.publicUrl;

mediaName =
file.name;

mediaType =
file.type ||
"application/octet-stream";

mediaSize =
file.size;
}


/* INSERT MESSAGE */

const {
error
}=await supabaseClient
.from("messages")
.insert({

sender_id:
currentUser.id,

receiver_id:
currentContact.id,

content:
text||null,

media_url:
mediaUrl,

media_name:
mediaName,

media_type:
mediaType,

media_size:
mediaSize

});

if(error){

console.error(error);

throw new Error(

/* DOWNLOAD */

async function downloadFile(
url,
fileName
){

try{

const response =
await fetch(url);

if(!response.ok){

throw new Error(
"Не удалось скачать файл"
);
}

const blob =
await response.blob();

const blobUrl =
URL.createObjectURL(blob);

const link =
document.createElement("a");

link.href=blobUrl;

link.download=fileName;

document.body.appendChild(link);

link.click();

link.remove();

setTimeout(()=>{
URL.revokeObjectURL(
blobUrl
);
},1000);

}catch(error){

console.error(error);

window.open(
url,
"_blank"
);

}

}


/* FILE SIZE */

function formatFileSize(bytes){

if(!bytes){
return "";
}

if(bytes<1024){

return bytes+" Б";
}

if(bytes<1024*1024){

return (
bytes/1024
).toFixed(1)+" КБ";
}

if(bytes<1024*1024*1024){

return (
bytes/
(1024*1024)
).toFixed(1)+" МБ";
}

return (
bytes/
(1024*1024*1024)
).toFixed(1)+" ГБ";
}

"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

characters.charAt(

);

/* CHANGE AVATAR */

const avatarInput =
document.getElementById("avatarInput");

const changeAvatarButton =
document.getElementById("changeAvatarButton");


changeAvatarButton.onclick=()=>{

    avatarInput.click();

};


avatarInput.addEventListener(
    "change",
    async event=>{

        const file =
        event.target.files[0];

        if(!file){
            return;
        }

        /* Проверяем размер */

        const maxSize =
        10 * 1024 * 1024;

        if(file.size > maxSize){

            alert(
                "Фото слишком большое. Максимальный размер — 10 МБ."
            );

            avatarInput.value="";
            return;
        }


        /* Проверяем тип */

        if(!file.type.startsWith("image/")){

            alert(
                "Можно выбрать только изображение."
            );

            avatarInput.value="";
            return;
        }


        changeAvatarButton.disabled=true;

        changeAvatarButton.textContent =
        "⏳ Загрузка...";


        try{

            const extension =
            file.name.includes(".")
            ? file.name.split(".").pop().toLowerCase()
            : "jpg";


            const filePath =
            currentUser.id +
            "/" +
            crypto.randomUUID() +
            "." +
            extension;


            /* Загружаем в avatars */

            const {
                error:uploadError
            } =
            await supabaseClient
            .storage
            .from("avatars")
            .upload(
                filePath,
                file,
                {
                    cacheControl:"3600",
                    upsert:false,
                    contentType:file.type
                }
            );


            if(uploadError){

                console.error(uploadError);

                throw new Error(
                    "Не удалось загрузить фото: " +
                    uploadError.message
                );
            }


            /* Получаем публичную ссылку */

            const {
                data:publicData
            } =
            supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(filePath);


            const avatarUrl =
            publicData.publicUrl;


            /* Сохраняем ссылку в profiles */

            const {
                error:updateError
            } =
            await supabaseClient
            .from("profiles")
            .update({
                avatar_url:avatarUrl
            })
            .eq(
                "id",
                currentUser.id
            );


            if(updateError){

                console.error(updateError);

                throw new Error(
                    "Не удалось сохранить фото профиля: " +
                    updateError.message
                );
            }


            /* Обновляем текущий профиль */

            currentProfile.avatar_url =
            avatarUrl;


            /* Обновляем фото на странице профиля */

            const profileAvatar =
            document.getElementById(
                "profileAvatar"
            );

            profileAvatar.innerHTML =
            `<img src="${escapeHtml(avatarUrl)}" alt="">`;


            /* Если сейчас открыт чат */

            if(currentContact){

                setAvatar(
                    document.getElementById(
                        "chatAvatar"
                    ),
                    currentProfile
                );

            }


            /* Обновляем список чатов */

            await loadChats();


            alert(
                "✅ Фото профиля изменено!"
            );


        }catch(error){

            console.error(error);

            alert(
                error.message
            );

        }finally{

            changeAvatarButton.disabled=false;

            changeAvatarButton.textContent =
            "📷 Изменить фото";

            avatarInput.value="";

        }

    }
);
